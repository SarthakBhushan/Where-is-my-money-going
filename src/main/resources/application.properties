spring.application.name=backend
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false
whereismymoneygoing.local-rules-path=local_data/merchant.local.yml

# ---- Local AI assistant (Ollama) ----
# Ollama must be installed and running separately: see OLLAMA_SETUP.md
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:1.5b
spring.ai.ollama.chat.options.temperature=0.2
# Ollama's default context is only 2048 tokens, which would cut off the financial facts.
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.keep-alive=10m
# Never auto-pull on startup: the app must still start when Ollama isn't running.
spring.ai.ollama.init.pull-model-strategy=never
# Small models on a CPU can take minutes to finish a reply; the default async timeout is 30 s.
spring.mvc.async.request-timeout=600000
