name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Build Docker image
        run: docker build -t whereismymoneygoing .

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 whereismymoneygoing
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 3
          done
          echo "App did not start. Logs:"
          docker logs app
          exit 1